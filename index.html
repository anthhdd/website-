<style>
:root{--gold:#f5aa35;--cream:#f4efe5;--muted:#aaa49a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101214;color:var(--cream);font-family:Inter,Arial,sans-serif;overflow-x:hidden}
